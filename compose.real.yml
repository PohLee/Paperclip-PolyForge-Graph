name: polyforge-graph-real

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: polyforge
      POSTGRES_PASSWORD: ${POLYFORGE_REAL_DB_PASSWORD:?Run node scripts/prepare-real-env.mjs first}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyforge -d paperclip"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - polyforge_real_pgdata:/var/lib/postgresql/data

  paperclip:
    image: ghcr.io/paperclipai/paperclip:2026.1023.0@sha256:40f46940c4612ead131aebe6079cd4651f8cd1434af49f7c621887f4a452a62e
    command: ["sh", "-lc", "umask 077; cp /run/secrets/polyforge-codex-auth.json /paperclip/.codex/auth.json; exec node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js"]
    ports:
      - "127.0.0.1:3311:3100"
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      DATABASE_URL: postgres://polyforge:${POLYFORGE_REAL_DB_PASSWORD}@db:5432/paperclip
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: http://localhost:3311
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: http://localhost:3311
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3311,http://localhost:3100
      PAPERCLIP_API_URL: http://localhost:3100
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${POLYFORGE_REAL_BETTER_AUTH_SECRET:?Run node scripts/prepare-real-env.mjs first}
      PAPERCLIP_AGENT_JWT_SECRET: ${POLYFORGE_REAL_AGENT_JWT_SECRET:?Run node scripts/prepare-real-env.mjs first}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${POLYFORGE_REAL_TOOL_ACTION_SIGNING_SECRET:?Run node scripts/prepare-real-env.mjs first}
      POLYFORGE_PACK_ENTRIES: /opt/polyforge/packs/index.mjs
      POLYFORGE_ADLC_PACK_ENTRY: /opt/polyforge/packs/packs/adlc/index.mjs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - polyforge_real_data:/paperclip
      - ./:/opt/polyforge/plugin:ro
      - ../Paperclip-PolyForge-Graph-Packs:/opt/polyforge/packs:ro
      - ./examples/decision-register:/workspace/decision-register
      # Preserve future Codex session evidence across container restarts while
      # keeping the copied authentication file in the private parent tmpfs.
      - polyforge_real_codex_sessions:/paperclip/.codex/sessions
      - type: bind
        source: ${POLYFORGE_CODEX_AUTH_FILE:?Run node scripts/prepare-real-env.mjs first}
        target: /run/secrets/polyforge-codex-auth.json
        read_only: true
    tmpfs:
      - /paperclip/.codex:uid=1000,gid=1000,mode=0700
    pids_limit: 2048
    stop_grace_period: 90s

volumes:
  polyforge_real_pgdata:
  polyforge_real_data:
  polyforge_real_codex_sessions:
